version: 2
updates:
  # The root directory covers the whole pnpm workspace (the library and examples/*),
  # which share the single root pnpm-lock.yaml.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "Asia/Tokyo"
    # Skip versions published in the last few days (broken releases, hijacked packages).
    # Security updates are not delayed by cooldown.
    cooldown:
      default-days: 3
      semver-major-days: 14
    open-pull-requests-limit: 5
    # This is a published library: only touch a manifest range when the new version
    # falls outside it, so the `hono` peerDependencies range is never rewritten.
    versioning-strategy: "increase-if-necessary"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    # The Vite+ toolchain comes from the pnpm catalog (vite is aliased to
    # @voidzero-dev/vite-plus-core) and vite/vitest are pinned via pnpm overrides,
    # which Dependabot cannot keep in sync. The AI task updates it.
    ignore:
      - dependency-name: "vite"
      - dependency-name: "vite-plus"
      - dependency-name: "vitest"
    # Major updates are not grouped, so each major lands as its own PR.
    groups:
      production-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-minor-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
