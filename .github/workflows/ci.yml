name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: "1.7.0"
          node-version: ${{ matrix.node-version }}
          cache: true
          run-install: false
      - run: pnpm install --frozen-lockfile
      - name: Verify compatibility-test runtime
        run: pnpm exec node -e 'const expected = "${{ matrix.node-version }}"; if (process.versions.node.split(".")[0] !== expected) throw new Error(`Expected Node ${expected}, got ${process.version}`)'
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
