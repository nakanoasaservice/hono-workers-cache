  vitest: 5.0.5
  vite-plus: 1.4.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
  undici@<7.30.1: ">=7.30.1 <8"
  sharp@<0.35.5: ">=0.35.5 <1"
