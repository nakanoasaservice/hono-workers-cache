packages:
  - "."
  - "examples/*"

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
overrides:
  vite@*: "catalog:"
  undici@<7.30.1: ">=7.30.1 <8"
  sharp@<0.35.5: ">=0.35.5 <1"
  brace-expansion@<2.1.8: "^2.1.8"
  "@hono/node-server@<2.1.3": "2.1.9"
  "minimatch@<11.0.1": "11.0.9"

allowBuilds:
  esbuild: true
  workerd: true
  sharp: true

# Vite+ selects Node from package.json; do not let pnpm override CI matrices.
runtimeOnFail: ignore
